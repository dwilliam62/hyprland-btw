

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# Sets default wallpaper
exec-once = hyprpaper &
# Start quickshell-overview daemon for workspace preview
exec-once = qs -c overview &
# Start standalone Noctalia v5
exec-once = noctalia &
# Optional systemd user service form:
#exec-once = systemctl --user start noctalia

