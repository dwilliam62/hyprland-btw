# ==================================================
#  MangoWC - (2026)
#  Mango Key Bindings
# ==================================================

# ============================================
# System Actions
# ============================================
bind=SUPER+ALT,r,spawn_shell,~/.config/mangowc/bin/reload.sh
bind=SUPER+ALT,l,spawn,noctalia msg session lock
bind=SUPER+SHIFT,M,spawn_shell,session-logout
bind=SUPER,q,killclient,

# ============================================
# Audio (media keys)
# ============================================
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle

# ============================================
# Applications (Kitty / Ghostty + Noctalia)
# ============================================
bind=SUPER,Return,spawn,kitty
bind=SUPER+CTRL,Return,spawn,kitty
bind=SUPER+SHIFT,Return,spawn,ghostty

# Scratchpad terminal (drop-down kitty)
bind=SUPER+SHIFT,T,toggle_named_scratchpad,none,scratchpad,kitty -T scratchpad

# Noctalia Shell Controls
bind=SUPER,D,spawn,noctalia msg panel-toggle launcher
bind=SUPER+SHIFT,w,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER+SHIFT,period,spawn,noctalia msg settings-toggle

# Utilities & File Managers
bind=SUPER,E,spawn_shell,thunar
bind=SUPER+ALT,F,spawn_shell,nautilus
bind=SUPER,Y,spawn_shell,kitty -T floating-kitty -e yazi
bind=SUPER+ALT,B,spawn_shell,kitty -T btop -e btop
bind=SUPER+SHIFT,S,spawn_shell,~/.config/mangowc/bin/screenshot.sh

# ============================================
# Window Focus (SUPER + Arrows)
# ============================================
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# ============================================
# Window Movement (SUPER + Shift + Arrows)
# ============================================
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# Mouse Window Movement
axisbind=SUPER+ALT,UP,focusdir,left
axisbind=SUPER+ALT,DOWN,focusdir,right

# ============================================
# Workspace Navigation (Tags)
# ============================================
bind=SUPER+CTRL,Up,viewtoleft,0
bind=SUPER+CTRL,Down,viewtoright,0
bind=SUPER+CTRL+ALT,Up,tagtoleft,0
bind=SUPER+CTRL+ALT,Down,tagtoright,0

# Mouse wheel workspace navigation
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER,DOWN,viewtoright
axisbind=SUPER+CTRL,UP,tagtoleft
axisbind=SUPER+CTRL,DOWN,tagtoright

# ============================================
# Workspaces (1-9)
# ============================================
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# ============================================
# Monitor Navigation
# ============================================
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Right,focusmon,right
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right

# ============================================
# Window States & Actions
# ============================================
bind=SUPER,equal,resizewin,5,0
bind=SUPER,minus,resizewin,-5,0
bind=SUPER+CTRL,equal,resizewin,0,5
bind=SUPER+CTRL,minus,resizewin,0,-5

bind=SUPER,space,togglefloating
bind=SUPER,O,toggleoverview,
bind=ALT,Tab,toggleoverview,
bind=SUPER,Tab,focusstack,next

bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER,f,togglemaximizescreen,
#bind=SUPER,f,togglefakefullscreen,
bind=ALT,a,togglemaximizescreen,

bind=SUPER,I,minimized,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER+SHIFT,o,toggleoverlay,
bind=SUPER+SHIFT,g,toggleglobal,
bind=ALT,z,toggle_scratchpad

# ============================================
# Gaps & Layout
# ============================================
bind=CTRL,space,switch_layout
bind=SUPER+ALT,f,set_proportion,1.0
bind=ALT,space,switch_proportion_preset,

bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps
bind=SUPER+SHIFT,A,spawn_shell,~/.config/mangowc/bin/toggle-outer-gaps.sh

# ============================================
# Mouse Button Bindings
# ============================================
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ============================================
# Axis Bindings
# ============================================
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# ============================================
# Passthrough Mode (Keymode)
# Temporarily disables host key and mouse bindings so
# shortcuts pass directly to virtual machines or remote sessions.
# ============================================
# Explicitly set to default mode for the entry shortcut
keymode=default

# Press SUPER + P to enter passthrough mode
bind=SUPER,P,setkeymode,passthrough

# --- Start of Passthrough Mode ---
keymode=passthrough

# Press SUPER + Escape to exit passthrough and return to host control
bind=SUPER,Escape,setkeymode,default

# Because host mouse and key binds are in 'default' and not 'passthrough',
# MangoWM will ignore them while this mode is active.
keymode=default
