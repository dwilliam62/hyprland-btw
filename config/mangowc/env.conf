# ==================================================
#  MangoWC - (2026)
#  Mango Environment Variables
# ==================================================

# Version tracking
env=MANGO_DOTS_VERSION,0.1.0

# ============================================
# Default Window Manager Layout
# ============================================
# Available layouts in Mango:
#   scroller           - Horizontal scrolling layout (windows scroll side-by-side)
#   tile               - Traditional master-stack tiling (master left, stack right)
#   grid               - Arranges windows evenly across a grid
#   monocle            - Maximizes the single active window (fullscreen view)
#   deck               - Stack of windows like a card deck, showing top window
#   center_tile        - Centered master area with stacks on left and right
#   right_tile         - Stack on left, master on right
#   vertical_scroller  - Vertical scrolling layout (windows stack vertically)
#   vertical_tile      - Master-stack with vertical split (master on top)
#   vertical_grid      - Vertical grid layout
#   vertical_deck      - Vertical deck layout
#   dwindle            - Spiral / recursive splitting layout
#   fair               - Even horizontal space allocation
#   vertical_fair      - Even vertical space allocation
env=MANGO_DEFAULT_LAYOUT,dwindle

# Default editor 
env=EDITOR,nvim
# default Vistual
env=VISUAL,neovide

# GTK / Qt theming
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# Cursor and icon themes
env=XCURSOR_THEME,Bibata-Modern-Ice
env=XCURSOR_SIZE,24
# Note: WLR_NO_HARDWARE_CURSORS is dynamically managed in autostart.sh for NVIDIA and VM setups

# Session identity
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
