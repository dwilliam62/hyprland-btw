# ==================================================
#  MangoWC - (2026)
#  Mango Monitor Rules
# ==================================================

# Virtual Machine monitor rule (forces 1080p60 on virtual display)
[[rule.monitor_rule]]
name = "Virtual-1"
width = 1920
height = 1080
refresh = 60
x = 0
y = 0
scale = 1.0
vrr = 0

# Default monitor rule (matches any output, auto-detects native resolution and refresh rate)
# Fields: name, width, height, refresh, x, y, scale, vrr
[[rule.monitor_rule]]
name = ".*"
scale = 1.0
vrr = 0
